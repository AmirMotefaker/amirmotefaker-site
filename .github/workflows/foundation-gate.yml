name: Foundation Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  product-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Foundation Product Test
        shell: pwsh
        run: ./scripts/Test-Product.ps1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Clerk Production Readiness Gate
        working-directory: apps/web
        run: npm run test:clerk-readiness
